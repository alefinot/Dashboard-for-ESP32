; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; arduino-esp32 3.3.12 (ESP-IDF v5.5.5) via the pioarduino community fork -
; the official SCons platform stops at 2.0.17 (espressif/arduino-esp32#8606,
; platformio/platform-espressif32#1225). Pinned to an exact release tag.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200








lib_extra_dirs = lib
lib_deps = lovyan03/LovyanGFX@^1.2.29
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; gzip the embedded config page (src/webui.html  ->  src/webui_html_gz.h)
extra_scripts = pre:scripts/gzip_webui.py, pre:scripts/vlw_to_header.py

; For OTA upload via PlatformIO, use:
; pio run -t upload --upload-port <ESP_IP>
